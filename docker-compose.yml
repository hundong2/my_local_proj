version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "26280:80"
      - "26443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./ssl-certs:/etc/ssl/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - keycloak
      - openwebui
      - code-server
      - fastapi
      - oauth2-proxy
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_ENABLED=${SSL_ENABLED:-false}

  # Keycloak Authentication Server
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER:-keycloak}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-keycloak123}
      - KC_HOSTNAME_URL=http://localhost:26280/auth
      - KC_HOSTNAME_ADMIN_URL=http://localhost:26280/auth
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY=edge
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_ADDRESS_FORWARDING=true
    command: start
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - keycloak-data:/opt/keycloak/data

  # PostgreSQL Database for Keycloak
  postgres:
    image: postgres:15-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${POSTGRES_USER:-keycloak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-keycloak123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  # OpenWebUI for AI Models
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-secret}
      - WEBUI_BASE_URL=/webui
      - PUBLIC_URL=/webui
    volumes:
      - openwebui-data:/app/backend/data
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - keycloak

  # Code Server (VSCode in browser)
  code-server:
    image: codercom/code-server:latest
    container_name: code-server
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-password123}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD:-password123}
    volumes:
      - code-server-data:/home/coder
      - ./workspace:/home/coder/workspace
    restart: unless-stopped
    networks:
      - backend
    user: "1000:1000"

  # FastAPI Toy Server
  fastapi:
    build: ./fastapi
    container_name: fastapi-toy
    environment:
      - ENVIRONMENT=production
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-master}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-fastapi}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - HF_HOME=/home/appuser/.cache/huggingface
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/home/appuser/.cache/huggingface
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - keycloak

  # OAuth2 Proxy for SSO (Keycloak OIDC)
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=file:///dev/null
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET:-changeme-base64-32}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_PROXY_CLIENT_ID:-nginx-oauth2-proxy}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET:-}
      - OAUTH2_PROXY_OIDC_ISSUER_URL=${PUBLIC_BASE_URL:-http://localhost:26280}/auth/realms/${KEYCLOAK_REALM:-master}
      - OAUTH2_PROXY_REDIRECT_URL=${PUBLIC_BASE_URL:-http://localhost:26280}/oauth2/callback
      - OAUTH2_PROXY_SCOPE=openid email profile
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECURE=${SSL_ENABLED:-false}
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
    networks:
      - backend

volumes:
  postgres-data:
    driver: local
  keycloak-data:
    driver: local
  openwebui-data:
    driver: local
  code-server-data:
    driver: local
  nginx-cache:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
