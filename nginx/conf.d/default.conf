# Upstream definitions
upstream keycloak {
    server keycloak:8080;
}

upstream openwebui {
    server openwebui:8080;
}

upstream code-server {
    server code-server:8080;
}

upstream fastapi {
    server fastapi:8000;
}

# Internal auth check (simplified version)
server {
    listen 127.0.0.1:80;
    server_name auth-internal;
    
    location /auth-check {
        internal;
        proxy_pass http://keycloak/realms/master/protocol/openid_connect/userinfo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }
}

# Main server configuration
server {
    listen 80 default_server;
    server_name _;
    
    # Redirect to HTTPS if SSL is enabled (update port if needed)
    # Uncomment the following lines when SSL is configured
    # return 301 https://$server_name:26443$request_uri;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Keycloak authentication server (public access)
    # Note: Keycloak 22+ removed /auth prefix by default
    location /auth {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Keycloak direct paths (for admin and realms)
    location /realms {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Keycloak admin console
    location /admin {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Keycloak resources
    location /resources {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        
        # Cache static resources
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # (duplicate blocks for /realms, /admin, /resources removed)

    # OpenWebUI (simplified - no auth for initial testing)
    location /webui {
        # Rewrite URL to remove /webui prefix
        rewrite ^/webui/(.*) /$1 break;
        rewrite ^/webui$ / break;
        
        proxy_pass http://openwebui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /webui;
        
        # WebSocket support for real-time features
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Large file uploads
        client_max_body_size 100M;
        proxy_request_buffering off;
    }

    # Code Server (simplified - no auth for initial testing)
    location /vscode {
        # Rewrite URL to remove /vscode prefix
        rewrite ^/vscode/(.*) /$1 break;
        rewrite ^/vscode$ / break;
        
        proxy_pass http://code-server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /vscode;
        
        # WebSocket support for VSCode
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # FastAPI Toy Server (simplified - no auth for initial testing)
    location /toy {
        # Strip /toy prefix so FastAPI can keep simple routes
        rewrite ^/toy/(.*) /$1 break;
        rewrite ^/toy$ / break;

        proxy_pass http://fastapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /toy;
        
        # API rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    # Authentication check endpoint (internal)
    location = /auth-check {
        internal;
        proxy_pass http://keycloak/realms/master/protocol/openid_connect/userinfo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # Authentication redirect
    location @auth_redirect {
        return 302 /realms/master/protocol/openid_connect/auth?client_id=nginx-proxy&response_type=code&scope=openid&redirect_uri=$scheme://$server_name$request_uri;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Root location - serve dashboard
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }
    
    # Static files
    location /static {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
