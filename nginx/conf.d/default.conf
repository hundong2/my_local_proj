# Upstream definitions
upstream keycloak {
    server keycloak:8080;
}

upstream openwebui {
    server openwebui:8080;
}

upstream code-server {
    server code-server:8080;
}

upstream fastapi {
    server fastapi:8000;
}

# Keycloak auth request endpoint
server {
    listen 80;
    server_name auth-internal;
    
    location /auth {
        internal;
        proxy_pass http://keycloak;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Main server configuration
server {
    listen 80;
    server_name _;
    
    # Redirect to HTTPS if SSL is enabled
    # Uncomment the following lines when SSL is configured
    # return 301 https://$server_name$request_uri;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keycloak authentication server (public access)
    location /auth {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenWebUI (protected by Keycloak)
    location /webui {
        # Authentication check
        auth_request /auth-check;
        auth_request_set $user $upstream_http_x_user;
        auth_request_set $auth_status $upstream_status;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        
        # Handle authentication errors
        error_page 401 = @auth_redirect;
        
        # Rewrite URL to remove /webui prefix
        rewrite ^/webui/(.*) /$1 break;
        
        proxy_pass http://openwebui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User $user;
        
        # WebSocket support for real-time features
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Large file uploads
        client_max_body_size 100M;
        proxy_request_buffering off;
    }

    # Code Server (protected by Keycloak)
    location /vscode {
        # Authentication check
        auth_request /auth-check;
        auth_request_set $user $upstream_http_x_user;
        
        error_page 401 = @auth_redirect;
        
        # Rewrite URL to remove /vscode prefix
        rewrite ^/vscode/(.*) /$1 break;
        
        proxy_pass http://code-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for VSCode
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # FastAPI Toy Server (protected by Keycloak)
    location /toy {
        # Authentication check
        auth_request /auth-check;
        auth_request_set $user $upstream_http_x_user;
        
        error_page 401 = @auth_redirect;
        
        # Keep /toy prefix for FastAPI routing
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User $user;
        
        # API rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    # Authentication check endpoint (internal)
    location = /auth-check {
        internal;
        proxy_pass http://keycloak/auth/realms/services/protocol/openid_connect/userinfo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # Authentication redirect
    location @auth_redirect {
        return 302 /auth/realms/services/protocol/openid_connect/auth?client_id=nginx-proxy&response_type=code&scope=openid&redirect_uri=$scheme://$server_name$request_uri;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Root redirect to Keycloak
    location = / {
        return 302 /auth/realms/services/account;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
