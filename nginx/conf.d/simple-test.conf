# Upstream definitions
upstream keycloak_backend {
    server keycloak:8080 max_fails=3 fail_timeout=30s;
}

upstream fastapi_backend {
    server fastapi:8000 max_fails=3 fail_timeout=30s;
}

upstream openwebui_backend {
    server openwebui:8080 max_fails=3 fail_timeout=30s;
}

upstream code_server_backend {
    server code-server:8080 max_fails=3 fail_timeout=30s;
}

# Simple test configuration for debugging
server {
    listen 80 default_server;
    server_name localhost;
    
    # Basic security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Root location with custom HTML
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Health check and service status
    location /health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Service health checks (internal testing)
    location /health-check/keycloak {
        access_log off;
        proxy_pass http://keycloak_backend/auth/realms/master;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    location /health-check/fastapi {
        access_log off;
        proxy_pass http://fastapi_backend/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # Keycloak proxy
    location /auth {
        proxy_pass http://keycloak_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
        
        # Retry settings
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }
    
    # FastAPI proxy (with URL rewriting)
    location /toy {
        # Remove /toy prefix and pass to FastAPI
        rewrite ^/toy/(.*) /$1 break;
        rewrite ^/toy$ / break;
        
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /toy;
        
        # Timeout and retry settings
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
    
    # OpenWebUI proxy
    location /webui {
        rewrite ^/webui/(.*) /$1 break;
        rewrite ^/webui$ / break;
        
        proxy_pass http://openwebui_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        client_max_body_size 100M;
    }
    
    # VSCode Server proxy
    location /vscode {
        rewrite ^/vscode/(.*) /$1 break;
        rewrite ^/vscode$ / break;
        
        proxy_pass http://code_server_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
