# Upstream definitions
upstream keycloak {
    server keycloak:8080;
}

upstream openwebui {
    server openwebui:8080;
}

upstream code-server {
    server code-server:8080;
}

upstream fastapi {
    server fastapi:8000;
}

# Internal auth check (simplified version)
server {
    listen 127.0.0.1:80;
    server_name auth-internal;
    
    location /auth-check {
        internal;
        proxy_pass http://keycloak/realms/master/protocol/openid_connect/userinfo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }
}

# Main server configuration
server {
    listen 80 default_server;
    server_name _;
    
    # Redirect to HTTPS if SSL is enabled (update port if needed)
    # Uncomment the following lines when SSL is configured
    # return 301 https://$server_name:26443$request_uri;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Keycloak authentication server (public access)
    # Note: Keycloak 22+ removed /auth prefix by default
    location /auth {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Keycloak direct paths (for admin and realms)
    location /realms {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Keycloak admin console
    location /admin {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Keycloak resources
    location /resources {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cache static resources
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
    
    # (duplicate blocks for /realms, /admin, /resources removed)

    # OpenWebUI (simplified - no auth for initial testing)
    # Redirect bare /webui to include trailing slash (consistency)
    location = /webui {
        return 302 /webui/;
    }

    location /webui/ {
        # auth_request /oauth2/auth;
        # error_page 401 = /oauth2/start?rd=$scheme://$http_host$request_uri;
        # Rewrite URL to remove /webui prefix
        rewrite ^/webui/(.*)$ /$1 break;
        
        proxy_pass http://openwebui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /webui;
        
        # Ensure the app uses /webui as base path (inject base at render)
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html application/javascript;
        sub_filter "base: \"\"" "base: \"/webui\"";
        sub_filter_once off;
        
        # WebSocket support for real-time features
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Large file uploads
        client_max_body_size 100M;
        proxy_request_buffering off;
    }

    # OpenWebUI backend API (frontend uses absolute /api)
    location ^~ /api/ {
        proxy_pass http://openwebui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        client_max_body_size 100M;
        proxy_buffering off;

        # WebSocket upgrade for streaming endpoints under /api
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # OpenWebUI WebSocket root (if used)
    location /ws {
        proxy_pass http://openwebui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # OpenWebUI static/assets when app emits absolute paths
    location ^~ /_app/ {
        proxy_pass http://openwebui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ^~ /static/ {
        proxy_pass http://openwebui;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Additional OpenWebUI root assets
    location = /service-worker.js {
        proxy_pass http://openwebui/service-worker.js;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /robots.txt {
        proxy_pass http://openwebui/robots.txt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Root-level font assets referenced by CSS
    location = /Inter-Variable.ttf {
        proxy_pass http://openwebui/Inter-Variable.ttf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        add_header Access-Control-Allow-Origin "*";
    }

    location = /Vazirmatn-Variable.ttf {
        proxy_pass http://openwebui/Vazirmatn-Variable.ttf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        add_header Access-Control-Allow-Origin "*";
    }

    location = /manifest.json {
        proxy_pass http://openwebui/manifest.json;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /opensearch.xml {
        proxy_pass http://openwebui/opensearch.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Code Server (SSO protected)
    location /vscode {
        # auth_request /oauth2/auth;
        # error_page 401 = /oauth2/start?rd=$scheme://$http_host$request_uri;
        # Rewrite URL to remove /vscode prefix
        rewrite ^/vscode/(.*) /$1 break;
        rewrite ^/vscode$ / break;
        
        proxy_pass http://code-server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /vscode;
        
        # WebSocket support for VSCode
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # FastAPI Toy Server (SSO protected)
    location /toy {
        # auth_request /oauth2/auth;
        # error_page 401 = /oauth2/start?rd=$scheme://$http_host$request_uri;
        # Strip /toy prefix so FastAPI can keep simple routes
        rewrite ^/toy/(.*) /$1 break;
        rewrite ^/toy$ / break;

        proxy_pass http://fastapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /toy;
        
        # API rate limiting
        # limit_req zone=api burst=20 nodelay;
    }

    # Authentication check endpoint (internal)
    location = /auth-check {
        internal;
        proxy_pass http://keycloak/realms/master/protocol/openid_connect/userinfo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # oauth2-proxy endpoints (SSO)
    location /oauth2/ {
        proxy_pass http://oauth2-proxy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy/auth;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Authentication redirect
    location @auth_redirect {
        return 302 /realms/master/protocol/openid_connect/auth?client_id=nginx-proxy&response_type=code&scope=openid&redirect_uri=$scheme://$server_name$request_uri;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Root location - serve dashboard
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }
    
    # Static files
    location /static {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
